  <rect x="24" y="30" width="80" height="72" rx="12" fill="#ffffff"/>
  <path d="M24 42a12 12 0 0 1 12-12h56a12 12 0 0 1 12 12v10H24z" fill="#ff5f05"/>
  <rect x="40" y="18" width="12" height="22" rx="6" fill="#ff5f05"/>
  <rect x="76" y="18" width="12" height="22" rx="6" fill="#ff5f05"/>
  <circle cx="64" cy="78" r="15" fill="#ff5f05"/>
</svg>
