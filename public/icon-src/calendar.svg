<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Candidate B — "Today".

    A navy tile with an orange calendar header and one white dot for today. It
    says "calendar" at a glance, which is what the extension is; the cost is
    that every calendar extension says the same thing, so it identifies the
    category rather than the product.
  -->
