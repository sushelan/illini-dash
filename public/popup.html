<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Illini Dash</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <div id="dots" class="dots"></div>
      <div class="bar--right">
        <button id="sync" class="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18a8 8 0 0 1-13-3"/></svg>Sync now</button>
        <a id="full" href="#" class="link">⤢ full view</a>
        <a id="settings" href="#" class="link" title="Settings" aria-label="Settings">⚙</a>
      </div>
    </header>
    <div id="blocked" class="banner banner-err" hidden></div>
    <div id="stale" class="banner" hidden></div>
    <div id="booking"></div>
    <nav id="tabs" class="tabs"></nav>
    <div id="filters" class="filters"></div>
    <div id="nav" class="datenav"></div>
    <main id="view"></main>
    <p id="status" class="muted"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
